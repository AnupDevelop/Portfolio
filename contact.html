<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - AnupDevelops</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav>
            <div class="left">
                <div class="logo"><img class="logo" src="logo.jpg" alt=""></div> AnupDevelops
            </div>
            <div class="right">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="contact.html">Contact me</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class="page-section contact-section">

            <h1>Contact Me</h1>
            <p>Send me a message and I will get back to you as soon as possible.</p>

            <!-- Contact Form using Formspree -->
            <form id="contactForm" class="contact-form" action="https://formspree.io/f/xnnezrlp" method="POST">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
                <button type="submit">Send Message</button>
            </form>

            <!-- Success Message -->
            <p id="successMessage" class="success-msg"></p>

        </section>
    </main>

    <script>
        const form = document.getElementById('contactForm');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // prevent page reload

            const formData = new FormData(form);

            try {
                const response = await fetch(form.action, {
                    method: form.method,
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    // Show success message
                    successMessage.textContent = "Form successfully submitted! I will try to respond to your email as soon as possible.";
                    successMessage.style.color = "lightgreen";
                    // Reset form
                    form.reset();
                } else {
                    successMessage.textContent = "Oops! There was a problem submitting your form.";
                    successMessage.style.color = "red";
                }

            } catch (error) {
                successMessage.textContent = "Oops! There was a problem submitting your form.";
                successMessage.style.color = "red";
            }
        });
    </script>

</body>

</html>
